<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр — ведение клиента</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f5f5f3;color:#171717;line-height:1.55}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin:16px 0}
h1,h2,h3{margin-top:0}.muted{color:#666}
.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;margin:3px;font-size:14px}
button{padding:11px 17px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:bold;cursor:pointer;margin:8px 6px 0 0}
button.secondary{background:#fff;color:#222;border:1px solid #aaa}
textarea{width:100%;min-height:100px;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit;box-sizing:border-box}
.answer{background:#f0f4ff;border-left:4px solid #4564d8;padding:12px;margin-top:12px}
.ok{background:#eef8ee;border-left:4px solid #39833f;padding:12px;margin-top:12px}
.bad{background:#fff3ed;border-left:4px solid #c55b32;padding:12px;margin-top:12px}
.score{font-size:42px;font-weight:bold}
.video{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:12px;background:#111}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
li{margin:8px 0}.hidden{display:none}.quote{background:#f7f7f7;border-left:4px solid #aaa;padding:10px 14px;margin:10px 0}
</style>
</head>
<body>

<div id="app"></div>

<script>
const A=document.getElementById('app');
let step=0;

const lessons=[
[
'Проверка понимания',
'Клиент: «Мне нужно оформить документы для подачи за границу». Сформулируй реплику, которая проверяет, правильно ли ты понял ситуацию.',
'Например: «Правильно понимаю, документы нужны для подачи за границу?»',
'Менеджер сначала синхронизируется с клиентом и проверяет исходные данные. В звонке: «Вам потрібно два екземпляри… Все правильно?»'
],
[
'Получение реакции',
'Ты озвучил клиенту условия. Он молчит. Что скажешь?',
'Например: «Как вам такой вариант?» или «Что скажете по условиям?»',
'После предложения менеджер не оставляет клиента молча. Она передаёт ему слово и получает реакцию.'
],
[
'Уточнение сомнения',
'Клиент: «Что-то мне не подходит». Что спросишь?',
'Например: «Подскажите, пожалуйста, что именно вам не подходит?»',
'Расплывчатое сомнение сначала превращается в конкретную информацию.'
],
[
'Поиск причины',
'Клиент требует определённый вариант. Выясни, зачем он ему нужен.',
'Например: «А подскажите, пожалуйста, для чего вам именно этот вариант?»',
'Формальное требование клиента не всегда является реальной потребностью.'
],
[
'Перефразирование',
'Клиент объяснил ситуацию длинно. Сформулируй короткое подтверждение понимания.',
'Например: «Правильно понимаю, что…?»',
'Перефразирование помогает проверить понимание и показать, что клиента услышали.'
],
[
'Использование слов клиента',
'Клиент: «Мне не срочно, главное — чтобы всё было правильно». Предложи решение на основе этого.',
'Например: «Тогда можем предложить вариант с более длительным сроком, но без спешки. Такой вариант вам подходит?»',
'Информация, которую дал клиент, становится основанием для следующего предложения.'
],
[
'Альтернатива и выбор',
'Есть вариант А — быстрее и дороже; вариант Б — дешевле и дольше. Как предложишь выбор?',
'Например: «Есть два варианта: быстрее за X или дешевле за Y. Какой вам удобнее?»',
'Менеджер структурирует варианты и помогает клиенту выбрать.'
],
[
'Помощь в выборе',
'Клиент: «Я не знаю, какой выбрать». Что делаешь?',
'Например: «А что для вас сейчас важнее — срок или стоимость?»',
'Если клиент не может выбрать, менеджер помогает определить критерий выбора.'
],
[
'Фиксация договорённости',
'Клиент: «Да, этот вариант мне подходит». Что делаешь дальше?',
'Например: «Правильно понимаю, что оформляем по этим условиям?»',
'Согласие превращается в конкретную договорённость.'
],
[
'Следующий шаг',
'Договорённость достигнута. Что спрашиваешь дальше?',
'Например: «Когда вам будет удобно подъехать?»',
'После решения менеджер переводит договорённость в конкретное действие.'
],
[
'Предупреждение вопросов',
'Клиент согласился приехать. Какие вещи стоит сообщить заранее?',
'Например: куда подойти, что взять с собой, что произойдёт после приезда.',
'Менеджер заранее снимает неопределённость и возможные вопросы.'
]
];

function intro(){
A.innerHTML=`
<div class="card">
<div class="muted">САМОСТОЯТЕЛЬНАЯ РАБОТА</div>

<h1>Тренажёр «Как вести клиента»</h1>

<p>
Сначала полностью прослушай образцовый звонок.
Затем пройди задания.
Не копируй фразы — учись выбирать следующий ход менеджера.
</p>

<div class="video">
<iframe
src="https://www.youtube.com/embed/vqOBYOjIYr0"
title="Образцовый звонок"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>

<p class="muted">
Посмотри/прослушай звонок целиком, затем нажми «Начать обучение».
</p>

<button onclick="start()">Начать обучение</button>
</div>

<div class="card">
<h2>Главное правило</h2>

<p>
<b>Не запоминай готовые фразы.</b>
Твоя задача — увидеть, какой коммуникативный ход делает менеджер
и научиться делать такой ход в другой ситуации.
</p>

<p>
<span class="tag">Понять</span>
<span class="tag">Уточнить</span>
<span class="tag">Перефразировать</span>
<span class="tag">Предложить</span>
<span class="tag">Получить реакцию</span>
<span class="tag">Договориться</span>
<span class="tag">Следующий шаг</span>
</p>
</div>
`;
}

function start(){
step=0;
showLesson();
}

function showLesson(){

if(step>=lessons.length){
exam();
return;
}

let x=lessons[step];

A.innerHTML=`
<div class="card">

<div class="muted">
НАВЫК ${step+1} ИЗ ${lessons.length}
</div>

<h2>${x[0]}</h2>

<p>
<b>Задание:</b> ${x[1]}
</p>

<textarea
id="a"
placeholder="Напиши свою реплику менеджера...">
</textarea>

<br>

<button onclick="checkLesson()">
Проверить себя
</button>

<div id="f"></div>

</div>
`;
}

function checkLesson(){

const a=document.getElementById('a').value.trim();

if(a.length<8){
document.getElementById('f').innerHTML=
'<div class="bad">Ответ слишком короткий. Сформулируй полноценный ход менеджера.</div>';
return;
}

document.getElementById('f').innerHTML=`
<div class="answer">

<b>Эталонный принцип:</b>
<br>
${lessons[step][3]}

<br><br>

<b>Пример:</b>
<br>
${lessons[step][2]}

<br><br>

<span class="muted">
Твоя фраза не обязана совпадать с примером.
Важно выполнить тот же коммуникативный приём.
</span>

</div>

<button onclick="step++;showLesson()">
Следующий навык
</button>
`;
}

function exam(){

const q=[

[
'Клиент: «Я пока не понимаю, какой вариант мне нужен».',
'Твой первый ход?',
'Уточни ситуацию или критерий выбора.'
],

[
'Клиент: «Дорого».',
'Твой следующий ход?',
'Не оправдывай цену автоматически; сначала выясни содержание сомнения.'
],

[
'Клиент: «Мне подходит, но нужно быстрее».',
'Твой следующий ход?',
'Уточни конкретный срок/дату и на основании этого предложи решение.'
],

[
'Клиент: «Да, этот вариант подходит».',
'Твой следующий ход?',
'Зафиксируй договорённость и переведи её в конкретное действие.'
]

];

A.innerHTML=`

<div class="card">

<div class="muted">
ФИНАЛЬНЫЙ ЗАЧЁТ
</div>

<h1>
Проведи клиента до договорённости
</h1>

<p>
Названия приёмов не указаны.
Сам выбери следующий ход.
</p>

</div>

${q.map((x,i)=>`

<div class="card">

<h3>
${i+1}. ${x[0]}
</h3>

<p>
${x[1]}
</p>

<textarea
id="q${i}"
placeholder="Твоя реплика...">
</textarea>

</div>

`).join('')}

<button onclick="finish()">
Сдать зачёт
</button>
`;
}

function finish(){

let good=0;

const words=[
['что','подскаж','важн','выб'],
['что','подскаж','именно','стоим','цен'],
['когда','дат','срок','успеть'],
['правильно','оформ','договор','следующ','зафикс']
];

words.forEach((w,i)=>{

const a=document
.getElementById('q'+i)
.value
.toLowerCase();

if(w.filter(k=>a.includes(k)).length>=2){
good++;
}

});

const p=Math.round(good/4*100);

A.innerHTML=`

<div class="card">

<div class="muted">
РЕЗУЛЬТАТ
</div>

<div class="score">
${p}%
</div>

<h1>
${good>=3?'Зачёт сдан':'Зачёт пока не сдан'}
</h1>

<p>
${
good>=3
?
'Теперь навык нужно проверять в реальных звонках.'
:
'Пройди практику ещё раз. Цель — научиться выбирать следующий ход, а не запоминать фразы.'
}
</p>

<h3>
Что проверяет руководитель в реальных звонках
</h3>

<ul>
<li>Понял ли менеджер ситуацию клиента.</li>
<li>Задаёт ли вопросы, которые двигают разговор.</li>
<li>Использует ли информацию и формулировки клиента.</li>
<li>Предлагает ли решение.</li>
<li>Получает ли реакцию после предложения.</li>
<li>Не перескакивает ли через нерешённое сомнение.</li>
<li>Фиксирует ли договорённость.</li>
<li>Переводит ли разговор в конкретный следующий шаг.</li>
</ul>

<button onclick="intro()">
Пройти заново
</button>

</div>
`;
}

intro();
</script>

</body>
</html>

return a
.slice()
.sort(()=>Math.random()-0.5);

}


function saveAttempt(data){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

}


function getAttempt(){

try{

return JSON.parse(
localStorage.getItem(KEY)||'null'
);

}

catch(e){

return null;

}

}

Представь реальный звонок:

какой ход действительно
двигает клиента дальше?

</p>


<button
onclick="beginExam()"
>

Начать зачёт

</button>

</div>

`;

}


/* =========================
   ЗАЧЁТ
========================= */

function beginExam(){

const old=getAttempt();


if(old){

showResult(old);

return;

}


const qs=
shuffle(examPool)
.slice(0,12);


examState={

questions:qs,

index:0,

correct:0,

answers:[]

};


renderExamQuestion();

}


function renderExamQuestion(){

const s=examState;

const q=s.questions[s.index];


A.innerHTML=`

<div class="card">

<div class="muted">

ЗАЧЁТ · ВОПРОС
${s.index+1}
ИЗ
${s.questions.length}

</div>


<div class="progress">

<div
style="
width:${Math.round(
(s.index/s.questions.length)*100
)}%"
></div>

</div>


<h2
style="margin-top:18px"
>

Какой следующий ход
менеджера?

</h2>


<div class="quote">

${q.q}

</div>


${

q.o.map(

(x,i)=>`

<label class="option">

<input
type="radio"
name="ans"
value="${i}"
>

${x}

</label>

`

).join('')

}


<button
onclick="examAnswer()"
>

Ответить

</button>


</div>

`;

}


function examAnswer(){

const r=
document
.querySelector(
'input[name="ans"]:checked'
);


if(!r){

alert(
'Выбери один вариант.'
);

return;

}


const q=
examState.questions[
examState.index
];


const ok=
Number(r.value)===q.a;


if(ok){

examState.correct++;

}


examState.answers.push({

question:q.q,

chosen:Number(r.value),

ok:ok

});


examState.index++;


if(
examState.index<
examState.questions.length
){

renderExamQuestion();

}

else{

finishExam();

}

}


/* =========================
   РЕЗУЛЬТАТ
========================= */

function finishExam(){

const pass=
examState.correct>=10;


const data={

date:
new Date()
.toLocaleString('ru-UA'),

score:
examState.correct,

total:
examState.questions.length,

passed:
pass

};


saveAttempt(data);


showResult(data);

}


function showResult(data){

A.innerHTML=`

<div class="card">

<div class="muted">
РЕЗУЛЬТАТ ЗАЧЁТА
</div>


<div class="score">

${data.score}/${data.total}

</div>


<h1>

${

data.passed

?

'Зачёт сдан'

:

'Зачёт не сдан'

}

</h1>


<p>

${data.date}

</p>


<div
class="${
data.passed
?
'ok'
:
'bad'
}"
>


<b>

${
data.passed

?

'Результат засчитан как прохождение учебного модуля.'

:

'Результат показывает, что навык пока недостаточно устойчив.'

}

</b>


<br><br>


Самостоятельный тест
не является финальной аттестацией.

Окончательная проверка —
реальные звонки.

</div>


${
data.passed

?

`

<h3>
Следующий этап
</h3>

<p>

Сделай скриншот этого экрана
и отправь руководителю.

После этого руководитель
слушает реальные звонки
и проверяет применение технологии.

</p>

`

:

`

<h3>
Что дальше
</h3>

<p>

В тренажёре нет кнопки
повторного зачёта.

Вернись к обучающим материалам
и отработай навыки.

Новый допуск к зачёту
выдаёт руководитель.

</p>

`

}


<p class="small">

Проверяемые навыки:

понимание ситуации,

уточнение,

перефразирование,

углубление,

использование слов клиента,

предложение решения,

получение реакции,

работа с сомнением,

выбор,

фиксация договорённости

и следующий шаг.

</p>


</div>

`;

}


/* =========================
   ЗАПУСК
========================= */

intro();

</script>

</body>
</html>

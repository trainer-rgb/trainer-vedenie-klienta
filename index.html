</head>

<body>

<div id="app"></div>

<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const SERVER =
'https://script.google.com/macros/s/AKfycbzPQRSxSKqMYuuFcHuV_BwjF_bVHjLeUX4D_sejSHc/exec';

const VIDEO =
'https://www.youtube.com/embed/vqOBYOjIYr0';

const app = document.getElementById('app');

let token = '';
let managerName = '';
let questions = [];
let examAnswers = [];
let examIndex = 0;


/* =====================================================
   JSONP
===================================================== */

function api(action, params={}){

  return new Promise((resolve,reject)=>{

    const callbackName =
      'cb_' + Date.now() + '_' +
      Math.floor(Math.random()*100000);

    const script =
      document.createElement('script');

    const query = new URLSearchParams();

    query.set('action', action);
    query.set('callback', callbackName);

    Object.keys(params).forEach(key=>{
      query.set(key, params[key]);
    });

    const timer = setTimeout(()=>{
      cleanup();
      reject(
        new Error('Сервер не ответил')
      );
    },15000);

    window[callbackName] = function(data){
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    function cleanup(){
      delete window[callbackName];
      script.remove();
    }

    script.onerror = function(){
      clearTimeout(timer);
      cleanup();
      reject(
        new Error('Ошибка соединения с сервером')
      );
    };

    script.src =
      SERVER + '?' + query.toString();

    document.body.appendChild(script);

  });

}


/* =====================================================
   ЭКРАН ВХОДА
===================================================== */

function loginScreen(message=''){

  app.innerHTML = `

  <div class="card">

    <div class="muted">
      ДОСТУП МЕНЕДЖЕРА
    </div>

    <h1>
      Тренажёр «Как вести клиента»
    </h1>

    <p>
      Введите своё имя и персональный код доступа.
    </p>

    ${
      message
      ?
      `<div class="bad">${message}</div>`
      :
      ''
    }

    <label>
      <b>Имя менеджера</b>
    </label>

    <input
      id="manager"
      type="text"
      placeholder="Например: Иван"
      autocomplete="off"
    >

    <label>
      <b>Код доступа</b>
    </label>

    <input
      id="code"
      type="password"
      placeholder="Введите код"
      autocomplete="off"
    >

    <button onclick="login()">
      Войти
    </button>

  </div>

  `;

}


async function login(){

  const name =
    document.getElementById('manager')
      .value.trim();

  const code =
    document.getElementById('code')
      .value.trim();

  if(!name || !code){

    loginScreen(
      'Введите имя и код доступа.'
    );

    return;
  }

  app.innerHTML = `

  <div class="card">

    <h2>Проверяем доступ...</h2>

    <p class="muted">
      Подождите несколько секунд.
    </p>

  </div>

  `;

  try{

    const result =
      await api('login',{
        name:name,
        code:code
      });

    if(!result.ok){

      loginScreen(
        result.error ||
        'Доступ не разрешён.'
      );

      return;
    }

    token = result.token;
    managerName = result.name;

    showIntro();

  }catch(err){

    loginScreen(
      'Не удалось связаться с сервером. ' +
      'Попробуйте ещё раз.'
    );

  }

}


/* =====================================================
   ВВЕДЕНИЕ
===================================================== */

function showIntro(){

  app.innerHTML = `

  <div class="card">

    <div class="muted">
      МЕНЕДЖЕР: ${escapeHtml(managerName)}
    </div>

    <h1>
      Тренажёр «Как вести клиента»
    </h1>

    <p>
      Сначала внимательно посмотрите образцовый звонок.
      Затем пройдите обучение.
      После обучения будет зачёт.
    </p>

    <div class="video">

      <iframe
        src="${VIDEO}"
        title="Образцовый звонок"
        allow="accelerometer; autoplay; clipboard-write;
        encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>

    <div class="answer">

      <b>На что обращать внимание в звонке:</b>

        <li>как менеджер выясняет ситуацию;</li>
        <li>как задаёт уточняющие вопросы;</li>
        <li>как использует слова клиента;</li>
        <li>как получает реакцию;</li>
        <li>как работает с новым сомнением;</li>
        <li>как формирует следующее предложение;</li>
        <li>как фиксирует договорённость.</li>
      </ul>

    </div>

    <button onclick="startTraining()">
      Я посмотрел. Начать обучение
    </button>

  </div>

  `;

}


/* =====================================================
   ОБУЧЕНИЕ
===================================================== */

const lessons = [

  [
    'Проверка понимания',
    'Клиент: «Мне нужно оформить документы для подачи за границу». Сформулируй реплику, которая проверяет, правильно ли ты понял ситуацию.',
    'Например: «Правильно понимаю, документы нужны для подачи за границу?»',
    'Сначала синхронизируйся с клиентом и проверь исходные данные.'
  ],

  [
    'Получение реакции',
    'Ты озвучил клиенту условия. Клиент молчит. Что скажешь?',
    'Например: «Как вам такой вариант?» или «Что скажете по условиям?»',
    'После предложения обязательно получи реакцию клиента.'
  ],

  [

    'Клиент: «Что-то мне не подходит». Что спросишь?',
    'Например: «Подскажите, пожалуйста, что именно вам не подходит?»',
    'Расплывчатое сомнение нужно превратить в конкретную информацию.'
  ],

  [
    'Поиск причины',
    'Клиент требует определённый вариант. Выясни, зачем он ему нужен.',
    'Например: «А подскажите, пожалуйста, для чего вам именно этот вариант?»',
    'Первоначальное требование не всегда равно реальной потребности.'
  ],

  [
    'Перефразирование',
    'Клиент объяснил ситуацию длинно. Сформулируй короткое подтверждение понимания.',
    'Например: «Правильно понимаю, что…?»',
    'Перефразируй суть и проверь, правильно ли понял.'
  ],

  [
    'Использование слов клиента',
    'Клиент: «Мне не срочно, главное — чтобы всё было правильно». Предложи решение на основе этого.',
    'Например: «Тогда можем предложить вариант с более длительным сроком, но без спешки. Такой вариант вам подходит?»',
    'Информация клиента должна влиять на следующее предложение.'
  ],

  [
    'Альтернатива и выбор',
    'Есть вариант А — быстрее и дороже; вариант Б — дешевле и дольше. Как предложишь выбор?',
    'Например: «Есть два варианта: быстрее за X или дешевле за Y. Какой вам удобнее?»',
    'Не бросай клиента с вариантами; структурируй выбор.'
  ],

  [
    'Помощь в выборе',
    'Клиент: «Я не знаю, какой выбрать». Что делаешь?',
    'Например: «А что для вас сейчас важнее — срок или стоимость?»',
    'Помоги клиенту определить критерий выбора.'
  ],

  [
    'Фиксация договорённости',
    'Клиент: «Да, этот вариант мне подходит». Что делаешь дальше?',
    'Например: «Правильно понимаю, что оформляем по этим условиям?»',
    'Согласие нужно превратить в конкретную договорённость.'
  ],

  [
    'Следующий шаг',
    'Договорённость достигнута. Что спрашиваешь дальше?',
    'Например: «Когда вам будет удобно подъехать?»',
    'После решения должен появиться конкретный следующий шаг.'
  ],

  [
    'Предупреждение вопросов',
    'Клиент согласился приехать. Какие вещи стоит сообщить заранее?',
    'Например: куда подойти, что взять с собой, что произойдёт после приезда.',
    'Менеджер заранее снимает неопределённость.'
  ]

];

let lessonIndex = 0;


function startTraining(){

  lessonIndex = 0;

  showLesson();

}


function showLesson(){

  if(lessonIndex >= lessons.length){

    examIntro();

    return;
  }

  const x = lessons[lessonIndex];

  const percent =
    Math.round(
      lessonIndex /
      lessons.length * 100
    );

  app.innerHTML = `

  <div class="card">

    <div class="muted">
      ОБУЧЕНИЕ · ШАГ
      ${lessonIndex+1}
      ИЗ
      ${lessons.length}
    </div>

    <div class="progress">
      <div style="width:${percent}%"></div>
    </div>

    <h2 style="margin-top:18px">
      ${escapeHtml(x[0])}
    </h2>

    <p>
      <b>Задание:</b>
      ${escapeHtml(x[1])}
    </p>

    <textarea
      id="lessonAnswer"
      placeholder="Напиши свою реплику менеджера..."
    ></textarea>

    <button onclick="checkLesson()">
      Проверить себя
    </button>

    <div id="lessonFeedback"></div>

  </div>

  `;

}


function checkLesson(){

  const field =
    document.getElementById(
      'lessonAnswer'
    );

  const answer =
    field.value.trim();

  if(answer.length < 8){

    document.getElementById(
      'lessonFeedback'
    ).innerHTML = `

      <div class="bad">

        Напиши полноценную реплику.
        В обучении можно пробовать снова.

      </div>

    `;

    return;
  }

  const x = lessons[lessonIndex];

  document.getElementById(
    'lessonFeedback'
  ).innerHTML = `

    <div class="answer">

      <b>Принцип:</b><br>
      ${escapeHtml(x[3])}

      <br><br>

      <b>Один из вариантов:</b><br>
      ${escapeHtml(x[2])}

      <br><br>

      <span class="muted">
        Не нужно заучивать эту фразу.
        Важно уметь сделать такой же
        коммуникативный ход своими словами.
      </span>

    </div>

    <button onclick="nextLesson()">
      Следующий навык
    </button>

  `;

}


function nextLesson(){

  lessonIndex++;

  showLesson();

}


/* =====================================================
   НАЧАЛО ЗАЧЁТА
===================================================== */

function examIntro(){

  app.innerHTML = `

  <div class="card">

    <div class="muted">
      ЗАЧЁТ
    </div>

    <h1>
      Проверка применения
    </h1>

    <p>
      Теперь будут новые ситуации.
      Здесь не будет названий приёмов
      и эталонных ответов.
    </p>

    <div class="grid">

      <div class="metric">
        <b>12 вопросов</b><br>
        Из банка сервер случайно выберет 12 ситуаций.
      </div>

      <div class="metric">
        <b>10 правильных</b><br>
        Для сдачи нужно минимум 10 из 12.
      </div>

    </div>

    <div class="bad">

      <b>Важно.</b><br><br>

      Это одна попытка.
      После отправки изменить ответы
      или пройти зачёт заново нельзя.

    </div>

    <p>
      Не угадывай по отдельным словам.
      Представь реальный разговор:
      какой следующий ход действительно
      двигает клиента дальше?
    </p>

    <button onclick="loadExam()">
      Начать зачёт
    </button>

  </div>

  `;

}


/* =====================================================
   ЗАГРУЗКА ЗАЧЁТА С СЕРВЕРА
===================================================== */

async function loadExam(){

  app.innerHTML = `

  <div class="card">

    <h2>
      Загружаем зачёт...
    </h2>

    <p class="muted">
      Формируем индивидуальный вариант.
    </p>

  </div>

  `;

  try{

    const result =
      await api('getTest',{
        token:token
      });

    if(!result.ok){

      showError(
        result.error ||
        'Не удалось получить зачёт.'
      );

      return;
    }

    questions =
      result.questions || [];

    examAnswers = [];

    examIndex = 0;

    if(!questions.length){

      showError(
        'Сервер не передал вопросы.'
      );

      return;
    }

    showExamQuestion();

  }catch(err){

    showError(
      'Не удалось получить зачёт. ' +
      'Проверьте соединение и попробуйте обновить страницу.'
    );

  }

}


/* =====================================================
   ВОПРОС ЗАЧЁТА
===================================================== */

function showExamQuestion(){

  const q =
    questions[examIndex];

  const percent =
    Math.round(
      examIndex /
      questions.length * 100
    );

  app.innerHTML = `

  <div class="card">

    <div class="muted">

      ЗАЧЁТ · ВОПРОС
      ${examIndex+1}
      ИЗ
      ${questions.length}

    </div>

    <div class="progress">

      <div style="width:${percent}%"></div>

    </div>

    <h2 style="margin-top:18px">

      Какой следующий ход
      менеджера?

    </h2>

    <div class="quote">

      ${escapeHtml(q.q)}

    </div>

    <div id="options">

      ${
        q.options.map((option,index)=>`

          <label class="option">

            <input
              type="radio"
              name="examAnswer"
              value="${index}"
            >

            ${escapeHtml(option)}

          </label>

        `).join('')
      }

    </div>

    <button onclick="nextExamQuestion()">

      ${
        examIndex === questions.length-1
        ?
        'Завершить зачёт'
        :
        'Ответить'
      }

    </button>

  </div>

  `;

}


function nextExamQuestion(){

  const selected =
    document.querySelector(
      'input[name="examAnswer"]:checked'
    );

  if(!selected){

    alert(
      'Выбери один вариант ответа.'
    );

    return;
  }

  examAnswers.push({

    id:questions[examIndex].id,

    answer:Number(
      selected.value
    )

  });

  examIndex++;

  if(examIndex < questions.length){

    showExamQuestion();

  }else{

    submitExam();

  }

}


/* =====================================================
   ОТПРАВКА ЗАЧЁТА
===================================================== */

async function submitExam(){

  app.innerHTML = `

  <div class="card">

    <h2>
      Проверяем зачёт...
    </h2>

    <p class="muted">
      Результат рассчитывается сервером.
    </p>

  </div>

  `;

  try{

    const result =
      await api('submit',{

        token:token,

        answers:JSON.stringify(
          examAnswers
        )

      });

    if(!result.ok){

      showError(
        result.error ||
        'Не удалось отправить результат.'
      );

      return;
    }

    showResult(result);

  }catch(err){

    showError(
      'Не удалось отправить результат. ' +
      'Не закрывайте страницу и попробуйте ещё раз.'
    );

  }

}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

function showResult(result){

  app.innerHTML = `

  <div class="card">

    <div class="muted">
      РЕЗУЛЬТАТ ЗАЧЁТА
    </div>

    <div class="score">
      ${result.score}/${result.total}
    </div>

    <h1>

      ${
        result.passed
        ?
        'Зачёт сдан'
        :
        'Зачёт не сдан'
      }

    </h1>

    <div class="${
      result.passed
      ?
      'ok'
      :
      'bad'
    }">

      <b>

        ${
          result.passed
          ?
          'Результат записан. Учебный модуль пройден.'
          :
          'Результат записан. Навык пока недостаточно устойчив.'
        }

      </b>

      <br><br>

      Результат:
      <b>${result.percent}%</b>

    </div>

    <h3>
      Что дальше
    </h3>

    ${
      result.passed

      ?

      `
      <p>
        Сделайте скриншот этого экрана
        и отправьте руководителю.
      </p>

      <p>
        Далее руководитель проверяет
        применение технологии
        в реальных звонках.
      </p>
      `

      :

      `
      <p>
        Вернитесь к обучающим материалам
        и отработайте навыки.
      </p>

      <p>
        Повторный допуск к зачёту
        выдаёт руководитель.
      </p>
      `

    }

    <div class="answer">

      <b>
        Важно:
      </b>

      <br><br>

      Этот экран нельзя использовать
      для повторной сдачи.

      Результат уже сохранён
      на сервере.

    </div>

  </div>

  `;

}


/* =====================================================
   ОШИБКА
===================================================== */

function showError(message){

  app.innerHTML = `

  <div class="card">

    <div class="bad">

      <b>Не удалось продолжить</b>

      <br><br>

      ${escapeHtml(message)}

    </div>

    <button
      class="secondary"
      onclick="location.reload()"
    >
      Обновить страницу
    </button>

  </div>

  `;

}


/* =====================================================
   ЭКРАНИРОВАНИЕ ТЕКСТА
===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренажёр — ведение клиента</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:24px;background:#f5f5f3;color:#171717;line-height:1.5}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin:16px 0}h1,h2{margin-top:0}.muted{color:#666}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit;box-sizing:border-box}button{padding:11px 17px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:bold;cursor:pointer;margin:8px 6px 0 0}.answer{background:#f0f4ff;border-left:4px solid #4564d8;padding:12px;margin-top:12px}.bad{background:#fff3ed;border-left:4px solid #c55b32;padding:12px;margin-top:12px}.score{font-size:42px;font-weight:bold}</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');let n=0;
const L=[
['Проверка понимания','Клиент: «Мне нужно оформить документы для подачи за границу». Сформулируй реплику, которая проверяет, правильно ли ты понял ситуацию.','Например: «Правильно понимаю, документы нужны для подачи за границу?»','Верни клиенту суть его запроса и получи подтверждение.'],
['Получение реакции','Ты озвучил клиенту условия. Он молчит. Что скажешь?','Например: «Как вам такой вариант?» или «Что скажете по условиям?»','После предложения получи реакцию клиента.'],
['Уточнение сомнения','Клиент: «Что-то мне не подходит». Что спросишь?','Например: «Подскажите, пожалуйста, что именно вам не подходит?»','Не отвечай на расплывчатое сомнение — сначала сделай его конкретным.'],
['Поиск причины','Клиент требует определённый вариант. Выясни, зачем он ему нужен.','Например: «А подскажите, пожалуйста, для чего вам именно этот вариант?»','Формальное требование может скрывать другую потребность.'],
['Перефразирование','Клиент объяснил ситуацию длинно. Сформулируй короткое подтверждение понимания.','Например: «Правильно понимаю, что…?»','Покажи клиенту, что услышал его, и проверь понимание.'],
['Использование слов клиента','Клиент: «Мне не срочно, главное — чтобы всё было правильно». Предложи решение на основе этого.','Например: «Тогда можем предложить вариант с более длительным сроком, но без спешки. Такой вариант вам подходит?»','Информация клиента должна влиять на следующее предложение.'],
['Альтернатива и выбор','Есть вариант А — быстрее и дороже; вариант Б — дешевле и дольше. Как предложишь выбор?','Например: «Есть два варианта: быстрее за X или дешевле за Y. Какой вам удобнее?»','Структурируй выбор и попроси клиента выбрать.'],
['Помощь в выборе','Клиент: «Я не знаю, какой выбрать». Что делаешь?','Например: «А что для вас сейчас важнее — срок или стоимость?»','Помоги определить критерий выбора.'],
['Фиксация договорённости','Клиент: «Да, этот вариант мне подходит». Что делаешь дальше?','Например: «Правильно понимаю, что оформляем по этим условиям?»','Согласие преврати в конкретную договорённость.'],
['Следующий шаг','Договорённость достигнута. Что спрашиваешь дальше?','Например: «Когда вам будет удобно подъехать?»','После решения должен появиться конкретный следующий шаг.'],
['Предупреждение вопросов','Клиент согласился приехать. Какие вещи стоит сообщить заранее?','Например: куда подойти, что взять с собой, что произойдёт после приезда.','Сними неопределённость до того, как она превратится в новый вопрос.']
];
function intro(){A.innerHTML='<div class="card"><div class="muted">САМОСТОЯТЕЛЬНАЯ РАБОТА</div><h1>Тренажёр «Как вести клиента»</h1><p>Сначала прослушай образцовый звонок. Затем проходи задания. Не копируй фразы — учись выбирать следующий ход менеджера.</p><p><b>Правило:</b> сначала отвечай сам, потом открывай эталон.</p><button onclick="start()">Начать</button></div>'}function start(){n=0;show()}function show(){if(n>=L.length){exam();return}let x=L[n];A.innerHTML='<div class="card"><div class="muted">НАВЫК '+(n+1)+' ИЗ '+L.length+'</div><h2>'+x[0]+'</h2><p><b>Ситуация:</b> '+x[1]+'</p><textarea id="a" placeholder="Напиши свою реплику менеджера..."></textarea><br><button onclick="check()">Проверить себя</button><div id="f"></div></div>'}function check(){let a=document.getElementById('a').value.trim();if(a.length<8){document.getElementById('f').innerHTML='<div class="bad">Сформулируй полноценный следующий ход.</div>';return}document.getElementById('f').innerHTML='<div class="answer"><b>Эталон:</b><br>'+L[n][2]+'<br><br><b>Принцип:</b> '+L[n][3]+'<br><br>Твоя фраза не обязана совпадать с эталоном. Важно выполнить тот же коммуникативный приём.</div><button onclick="n++;show()">Следующий навык</button>'}function exam(){const q=['Клиент: «Я пока не понимаю, какой вариант мне нужен».','Клиент: «Дорого».','Клиент: «Мне подходит, но нужно быстрее».','Клиент: «Да, этот вариант подходит».'];A.innerHTML='<div class="card"><div class="muted">ФИНАЛЬНЫЙ ЗАЧЁТ</div><h1>Проведи клиента до договорённости</h1><p>Названия приёмов не указаны. Сам выбери следующий ход.</p></div>'+q.map((x,i)=>'<div class="card"><h3>'+(i+1)+'. '+x+'</h3><textarea id="q'+i+'" placeholder="Твоя реплика..."></textarea></div>').join('')+'<button onclick="finish()">Сдать зачёт</button>'}function finish(){let good=0;let words=[['что','подскаж','важн','выб'],['что','подскаж','именно','стоим','цен'],['когда','дат','срок','успеть'],['правильно','оформ','договор','следующ','зафикс']];words.forEach((w,i)=>{let a=document.getElementById('q'+i).value.toLowerCase();if(w.filter(x=>a.includes(x)).length>=2)good++});let p=Math.round(good/4*100);A.innerHTML='<div class="card"><div class="muted">РЕЗУЛЬТАТ</div><div class="score">'+p+'%</div><h1>'+(good>=3?'Зачёт сдан':'Зачёт пока не сдан')+'</h1><p>'+(good>=3?'Теперь навык проверяется в реальных звонках.':'Пройди практику ещё раз: цель — научиться выбирать следующий ход, а не запоминать фразы.')+'</p><h3>В реальных звонках проверяется:</h3><ul><li>понял ли менеджер ситуацию;</li><li>уточняет ли недостаток информации;</li><li>использует ли слова клиента;</li><li>предлагает ли решение;</li><li>получает ли реакцию;</li><li>не перескакивает ли через сомнение;</li><li>фиксирует ли договорённость;</li><li>переводит ли разговор в конкретный следующий шаг.</li></ul><button onclick="intro()">Пройти заново</button></div>'}intro();
</script></body></html>
